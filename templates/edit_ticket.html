{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h4 class="mb-0 fw-semibold">
            <i class="fas fa-edit me-2" style="color: var(--primary);"></i>Редактирование заявки {{ ticket.ticket_number }}
        </h4>
        <span class="text-muted small">{{ ticket.title }}</span>
    </div>
    <a href="{{ url_for('tickets.ticket_detail', ticket_id=ticket.id) }}" class="btn btn-outline-modern">
        <i class="fas fa-arrow-left me-1"></i> Назад
    </a>
</div>

<div class="card-modern animate-fade-in">
    <div class="card-body">
        <form method="POST" id="editForm">
            <div class="row g-4">
                <div class="col-lg-8">
                    <div class="mb-3">
                        <label class="form-label-modern">Название <span class="text-danger">*</span></label>
                        <input type="text" class="form-control-modern" name="title" value="{{ ticket.title }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label-modern">Описание <span class="text-danger">*</span></label>
                        <div id="editor" class="quill-editor" style="min-height: 200px;"></div>
                        <input type="hidden" name="description" id="description">
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="mb-3">
                        <label class="form-label-modern">Приоритет</label>
                        <select class="form-select-modern" name="priority" id="priority" onchange="updateDeadline()">
                            <option value="Низкий" {% if ticket.priority == 'Низкий' %}selected{% endif %}>🟢 Низкий</option>
                            <option value="Средний" {% if ticket.priority == 'Средний' %}selected{% endif %}>🟡 Средний</option>
                            <option value="Высокий" {% if ticket.priority == 'Высокий' %}selected{% endif %}>🔴 Высокий</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label-modern">
                            <i class="far fa-calendar-alt me-1"></i>Планируемое начало
                        </label>
                        <input type="datetime-local" class="form-control-modern" name="start_date" 
                               value="{{ ticket.start_date.strftime('%Y-%m-%dT%H:%M') if ticket.start_date else '' }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label-modern">
                            <i class="far fa-clock me-1"></i>Дедлайн
                        </label>
                        <input type="datetime-local" class="form-control-modern" name="deadline" id="deadline"
                               value="{{ ticket.deadline.strftime('%Y-%m-%dT%H:%M') if ticket.deadline else '' }}">
                        <small class="text-muted d-block mt-1" id="deadline_info">
                            {% if ticket.deadline %}
                                Текущий дедлайн: {{ ticket.deadline.strftime('%d.%m.%Y %H:%M') }}
                            {% else %}
                                Не установлен
                            {% endif %}
                        </small>
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary-gradient" onclick="submitEdit()">
                            <i class="fas fa-save me-1"></i> Сохранить
                        </button>
                        <a href="{{ url_for('tickets.ticket_detail', ticket_id=ticket.id) }}" class="btn btn-outline-modern">Отмена</a>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>

<script>
var quill = new Quill('#editor', {
    theme: 'snow',
    modules: {
        toolbar: [
            ['bold', 'italic', 'underline', 'strike'],
            ['blockquote', 'code-block'],
            [{ 'list': 'ordered'}, { 'list': 'bullet' }],
            [{ 'indent': '-1'}, { 'indent': '+1' }],
            [{ 'header': [1, 2, 3, 4, 5, 6, false] }],
            [{ 'color': [] }, { 'background': [] }],
            ['link', 'image'],
            ['clean']
        ]
    }
});
quill.root.innerHTML = `{{ ticket.description|safe }}`;

function submitEdit() {
    document.getElementById('description').value = quill.root.innerHTML;
}

function updateDeadline() {
    const priority = document.getElementById('priority').value;
    priority.disabled = true
    const deadlineInput = document.getElementById('deadline');
    if (!deadlineInput.dataset.userChanged) {
        const now = new Date();
        let hours = 72;
        if (priority === 'Средний') hours = 24;
        else if (priority === 'Высокий') hours = 4;
        const deadline = new Date(now.getTime() + hours * 60 * 60 * 1000);
        deadlineInput.value = deadline.toISOString().slice(0, 16);
        document.getElementById('deadline_info').textContent = 
            `Автоматически рассчитано: ${deadline.toLocaleString('ru-RU')}`;
    }
}

document.getElementById('deadline').addEventListener('change', function() {
    this.dataset.userChanged = 'true';
    document.getElementById('deadline_info').textContent = 
        `Установлен вручную: ${new Date(this.value).toLocaleString('ru-RU')}`;
});
</script>
{% endblock %}
