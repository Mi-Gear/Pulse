<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Пульс</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: #fff;
            border-radius: 16px;
            padding: 40px 48px;
            box-shadow: 0 20px 60px rgba(16, 185, 129, 0.15);
            max-width: 420px;
            width: 100%;
        }
        .login-card .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-card .login-logo .pulse-icon {
            display: inline-block;
            position: relative;
        }
        .login-card .login-logo .pulse-icon svg {
            width: 64px;
            height: 64px;
        }
        .login-card .login-logo .pulse-icon .pulse-dot {
            position: absolute;
            bottom: -4px;
            right: -4px;
            width: 14px;
            height: 14px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse-dot 1.5s ease-in-out infinite;
            border: 2px solid #fff;
        }
        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.6); opacity: 0.3; }
        }
        .login-card .login-logo h4 {
            font-weight: 700;
            margin-top: 12px;
            color: #1a202c;
            font-size: 1.5rem;
        }
        .login-card .login-logo p {
            color: #64748b;
            font-size: 0.9rem;
        }
        .form-label-modern {
            font-weight: 500;
            color: #4a5568;
            margin-bottom: 4px;
            font-size: 0.85rem;
            display: block;
        }
        .form-control-modern {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.9rem;
            width: 100%;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-control-modern:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
            outline: none;
        }
        .btn-primary-gradient {
            background: linear-gradient(135deg, #10b981 0%, #047857 100%);
            border: none;
            color: #fff;
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            width: 100%;
            transition: all 0.3s ease;
        }
        .btn-primary-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
            color: #fff;
        }
        @media (max-width: 480px) {
            .login-card { padding: 24px 20px; margin: 0 16px; }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeInUp 0.5s ease forwards; }
    </style>
</head>
<body>
    <div class="login-card animate-fade-in">
        <div class="login-logo">
            <div class="pulse-icon">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10 50 L30 50 L40 20 L55 80 L65 40 L80 50 L90 50" 
                          stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="10" cy="50" r="4" fill="#10b981"/>
                    <circle cx="90" cy="50" r="4" fill="#10b981"/>
                </svg>
                <span class="pulse-dot"></span>
            </div>
            <h4>Пульс</h4>
            <p>Вход в систему</p>
        </div>

        <form method="POST" action="{{ url_for('login.login') }}">
            <div class="mb-3">
                <label class="form-label-modern">Имя пользователя</label>
                <input type="text" class="form-control-modern" name="username" placeholder="Введите имя пользователя" required>
            </div>

            <div class="mb-3">
                <label class="form-label-modern">Пароль</label>
                <input type="password" class="form-control-modern" name="password" placeholder="Введите пароль" required>
            </div>

            <button type="submit" class="btn-primary-gradient">
                <i class="fas fa-sign-in-alt me-2"></i> Войти
            </button>
        </form>

        <hr class="my-3">

        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category if category != 'message' else 'info' }} alert-dismissible fade show mt-3" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
